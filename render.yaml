services:
  - type: web
    name: taskpilot
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build && npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskpilot-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://task.shanse.dev
      - key: PUBLIC_APP_URL
        value: https://task.shanse.dev
      - key: NODE_ENV
        value: production

databases:
  - name: taskpilot-postgres
    databaseName: taskpilot
    user: taskpilot
    plan: free
    region: singapore
